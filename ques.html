  <style>
:root{--a1:#8B5CF6;--a2:#EC4899}
*{-webkit-tap-highlight-color:transparent}
body{font-family:var(--font,'Quicksand'),'Nunito',sans-serif;background:#F3E8FF;color:#1E293B;-webkit-text-size-adjust:100%}
body.min-h-screen{min-height:100vh;min-height:100dvh}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(max(46vw,280px) max(46vw,280px) at 6% 4%,rgba(167,139,250,.55),transparent 70%),radial-gradient(max(40vw,250px) max(40vw,250px) at 94% 32%,rgba(249,168,212,.5),transparent 70%),radial-gradient(max(36vw,240px) max(36vw,240px) at 46% 98%,rgba(125,211,252,.5),transparent 70%),linear-gradient(135deg,#E0E7FF 0%,#F3E8FF 48%,#FCE7F3 100%)}
.blobs i{display:none}
@media (hover:hover) and (pointer:fine){.blobs i{display:block;position:absolute;border-radius:50%;opacity:.5;will-change:transform;animation:drift 32s ease-in-out infinite alternate}.blobs i:nth-child(1){width:34vw;height:34vw;left:12vw;top:8vh;background:radial-gradient(closest-side,rgba(196,181,253,.9),transparent)}.blobs i:nth-child(2){width:30vw;height:30vw;right:6vw;top:42vh;background:radial-gradient(closest-side,rgba(251,207,232,.9),transparent);animation-delay:-11s}.blobs i:nth-child(3){width:28vw;height:28vw;left:38vw;bottom:-6vh;background:radial-gradient(closest-side,rgba(186,230,253,.9),transparent);animation-delay:-20s}}
@keyframes drift{to{transform:translate(5vw,4vh) scale(1.1)}}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.custom-scrollbar::-webkit-scrollbar{width:6px;height:6px}
.custom-scrollbar::-webkit-scrollbar-track{background:rgba(255,255,255,.3);border-radius:9999px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(167,139,250,.6);border-radius:9999px}
.glass,.glass-card{isolation:isolate;background:linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,.3));-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 2px rgba(139,92,246,.14),inset 0 0 28px rgba(255,255,255,.3),0 26px 60px -20px rgba(109,40,217,.32),0 2px 8px rgba(15,23,42,.05)}
.glass::before,.glass-card::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.28) 100%)}
.glass-card{position:relative;border-radius:28px}
.glass-card [class*="bg-white"],.glass-card [class*="bg-purple-50"],.glass-card [class*="bg-slate-50"],.glass-card [class*="bg-slate-100"]{background-color:rgba(255,255,255,.45)!important}
#add-counter-modal>div{background:rgba(255,255,255,.72)!important;-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1.5px 1px #fff,0 30px 70px -20px rgba(76,29,149,.45)}
.tabbar{position:relative;border-radius:9999px;padding:6px;overflow-x:auto;overscroll-behavior-x:contain}
.tab-track{position:relative;display:flex;gap:2px;width:max-content;min-width:100%}
.tab-thumb{position:absolute;top:0;left:0;height:100%;width:0;border-radius:9999px;pointer-events:none;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,0,0,.14),0 8px 22px -4px rgba(139,92,246,.55);transition:transform .55s cubic-bezier(.34,1.45,.5,1),width .55s cubic-bezier(.34,1.45,.5,1);will-change:transform,width}
.tab-thumb::after{content:'';position:absolute;inset:1px 10% auto;height:46%;border-radius:9999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.pill-tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9999px;font-weight:800;font-size:13px;white-space:nowrap;cursor:pointer;user-select:none;color:#64748B;transition:color .3s}
@media(hover:hover){.pill-tab:hover{color:#7C3AED}}
.pill-tab-active,.pill-tab-active:hover{color:#fff!important}
.btn{border-radius:9999px;padding:9px 16px;font-weight:800;font-size:12px;color:#6D28D9;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 4px 12px -4px rgba(109,40,217,.25);transition:transform .2s,background .2s}
@media(hover:hover){.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.85)}}
.btn:active{transform:scale(.96)}
.btn.pri{color:#fff;border-color:rgba(255,255,255,.5);background:linear-gradient(135deg,var(--a1),var(--a2))}
.inp{width:100%;min-width:0;border-radius:9999px;padding:10px 16px;font-weight:700;font-size:13px;color:#1E293B;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 3px rgba(109,40,217,.08);outline:none}
.inp:focus{box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.lbl{display:block;font-size:11px;font-weight:800;color:#64748B;margin-bottom:6px}
.chip{border-radius:9999px;padding:7px 13px;font-size:11px;font-weight:800;color:#6D28D9;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);transition:.25s}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:25px;border-radius:99px;background:rgba(100,116,139,.35);position:relative;flex:none;transition:.25s;cursor:pointer}
.sw:before{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.25s}
.sw:checked{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw:checked:before{left:22px}
.metric{border-radius:18px;padding:12px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85)}
.metric span{display:block;font-size:10px;font-weight:800;color:#64748B;margin-bottom:4px}
.metric strong{font-size:16px;font-weight:900;color:#6D28D9}
.binary{font-family:'DM Mono',monospace;color:#6D28D9;line-height:2;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.binary.empty{color:#94A3B8}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px;max-height:420px;overflow:auto;padding:4px 6px 8px 2px}
.swatch{position:relative;aspect-ratio:1;border-radius:11px;border:1px solid rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(15,23,42,.12);transition:transform .15s}
@media(hover:hover){.swatch:hover{transform:scale(1.15);z-index:2;outline:2px solid #fff;outline-offset:1px}}
.swatch.selected{outline:2px solid var(--a1);outline-offset:2px}
.swatch[aria-label]:hover:after{content:attr(aria-label);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1E1B4B;color:#fff;padding:5px 8px;border-radius:8px;font:10px 'DM Mono',monospace;white-space:nowrap;z-index:5;pointer-events:none}
.picked-chip{width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(15,23,42,.15);flex:none}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:480px;overflow:auto;padding:4px 6px 8px 2px}
.cc{height:46px;border-radius:14px;font-size:20px;color:#1E293B;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff;transition:transform .15s,background .15s}
@media(hover:hover){.cc:hover{transform:scale(1.2);background:#fff;position:relative;z-index:2}}
.cc:active{transform:scale(.92)}
.preview{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:24px}
.preview.show{display:flex}
.preview-meta{display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:99px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.preview-meta strong{font-family:'DM Mono',monospace}
.preview-close{position:absolute;top:22px;right:22px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;border:1px solid rgba(255,255,255,.6);font-size:22px}
.preview-hint{font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:9999px;font-size:12px;font-weight:800;color:#4C1D95;z-index:80;transition:.3s cubic-bezier(.34,1.4,.5,1);background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 1px #fff,0 14px 34px -10px rgba(76,29,149,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.format-painter-active{animation:pulseHighlight 1.2s infinite alternate;border-color:#EC4899!important;background-color:#FCE7F3!important;color:#BE185D!important}
@keyframes pulseHighlight{from{box-shadow:0 0 6px #EC4899}to{box-shadow:0 0 18px #8B5CF6}}
.editor-wrapper{position:relative}
.editor-watermark{position:absolute;top:20px;left:24px;right:24px;pointer-events:none;color:#94A3B8;opacity:.45;font-weight:600;line-height:1.6;user-select:none;z-index:0;transition:opacity .2s ease}
.editor-content{position:relative;z-index:10;background:transparent}
.out{border-radius:18px;padding:12px 14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);font-weight:700;font-size:13px;line-height:1.8;color:#4C1D95;word-break:break-word}
.meter{height:10px;border-radius:99px;background:rgba(100,116,139,.2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s,background .4s}
.term{font-family:'DM Mono',monospace;background:rgba(15,23,42,.9);color:#86EFAC;border-radius:20px;padding:16px;font-size:12.5px;line-height:1.7;min-height:130px;white-space:pre-wrap;word-break:break-all;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
input[type=range]{accent-color:var(--a1)}
@supports (color:color-mix(in srgb,red 50%,blue)){.tab-thumb{box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,0,0,.14),0 8px 22px -4px color-mix(in srgb,var(--a1) 65%,transparent)}}
@media (pointer:coarse){.glass,.glass-card{-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 2px rgba(139,92,246,.14),inset 0 0 20px rgba(255,255,255,.3),0 14px 30px -16px rgba(109,40,217,.3)}}
.tabbar.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.25))}
button,select,input,label,.chip,.cc,.swatch,.pill-tab{touch-action:manipulation}
.cc{content-visibility:auto;contain-intrinsic-size:46px 46px}
input[type=color]{width:100%;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5);padding:3px;cursor:pointer}
.qr-pre{width:40px;height:40px;border-radius:13px;border:2px solid #fff;box-shadow:0 3px 8px rgba(15,23,42,.2);transition:transform .15s}
.qr-pre:active{transform:scale(.9)}
#qr-cv{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:22px;box-shadow:0 14px 36px -14px rgba(109,40,217,.4)}
.mdl{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(30,27,75,.4)}
.mdl.open{display:flex}
#bug-modal{z-index:90}
@media(max-width:639px){#font-modal{align-items:flex-end}}
.fm-i{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px;font-weight:800;font-size:13px;color:#4C1D95;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8)}
.fm-i.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.tcard{perspective:800px;cursor:pointer}
.tinner{position:relative;aspect-ratio:2/3.1;transition:transform .7s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.tcard.flip .tinner{transform:rotateY(180deg)}
.tb,.tf{position:absolute;inset:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 10px 24px -10px rgba(76,29,149,.45)}
.tb{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.45) 0 9%,transparent 10%),repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px),linear-gradient(145deg,var(--a1),var(--a2));color:#fff;font-size:28px}
.tf{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,#F5F3FF);padding:8px;text-align:center}
.trot{display:flex;flex-direction:column;align-items:center;gap:5px}
.trot.rev{transform:rotate(180deg)}
.trot b{font-size:36px;line-height:1}
.trot span{font-size:11px;font-weight:900;color:#4C1D95}
.trot small{font-size:9px;font-weight:800;color:#94A3B8}
.tpos{margin-top:6px;text-align:center;font-size:10px;font-weight:900;color:#64748B}
@keyframes dealIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}
.deal{animation:dealIn .45s both}
.tb-on{background-image:linear-gradient(135deg,var(--a1),var(--a2))!important;color:#fff!important;border-color:var(--a1)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 6px 14px -6px rgba(109,40,217,.7)!important}
#sec-editor button[onclick^="execCmd("]{transition:background-image .15s,box-shadow .15s,color .15s}
@media(prefers-reduced-motion:reduce){.blobs i{animation:none}.tab-thumb{transition:none}}
</style>
</head>

    let sfxAudioCtx = null;
    function getSFXCtx() {
      if (!sfxAudioCtx) sfxAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (sfxAudioCtx.state === 'suspended') sfxAudioCtx.resume();
      return sfxAudioCtx;
    }

    const noiseCache = new WeakMap();

    function noiseBuf(c) {
      let b = noiseCache.get(c);
      if (!b) {
        b = c.createBuffer(1, c.sampleRate, c.sampleRate);
        const o = b.getChannelData(0);
        for (let i = 0; i < o.length; i++) o[i] = Math.random() * 2 - 1;
        noiseCache.set(c, b);
      }
      return b;
    }

    function synthSFX(c, type, now, dest) {
      const def = SFX[type];
      if (!def) return;
      dest = dest || c.destination;
      def[3].forEach(([w, f0, f1, t0, d, v]) => {
        const g = c.createGain(), s = now + t0;
        let src;
        if (w === 'noise') {
          src = c.createBufferSource();
          src.buffer = noiseBuf(c);
          const f = c.createBiquadFilter();
          f.type = 'bandpass';
          f.frequency.setValueAtTime(f0, s);
          if (f1) f.frequency.exponentialRampToValueAtTime(f1, s + d);
          src.connect(f);
          f.connect(g);
        } else {
          src = c.createOscillator();
          src.type = w;
          src.frequency.setValueAtTime(f0, s);
          if (f1) src.frequency.exponentialRampToValueAtTime(f1, s + d);
          src.connect(g);
        }
        g.gain.setValueAtTime(v, s);
        g.gain.exponentialRampToValueAtTime(.001, s + d);
        g.connect(dest);
        src.start(s);
        src.stop(s + d);
      });
    }

    function playSFXSynth(type) {
      const c = getSFXCtx(), m = c.createGain();
      m.gain.value = sfxVol;
      m.connect(c.destination);
      synthSFX(c, type, c.currentTime, m);
    }

  if(q.hint&&!done)h+=run.hint?`<div class="out">💡 ${esc(q.hint)}</div>`:'<button class="btn" data-act="hint">💡 Gợi ý</button>';
  if(done){
    const right=isMC(q)?q.o[q.a]:[].concat(q.a)[0];
    h+=`<div class="out" style="${run.ok?OK:BAD}">${run.ok?'✅ Chính xác!':'❌ Chưa đúng. Đáp án: <b>'+esc(right)+'</b>'}${q.exp?'<div class="mt-1 font-bold opacity-80">'+esc(q.exp)+'</div>':''}</div>`+
      `<button class="btn pri w-full" data-act="next">${run.i+1>=n?'🏁 Xem kết quả':'Câu tiếp theo →'}</button>`;
  }
  b.innerHTML=h;
  if(!done&&$('qz-in'))$('qz-in').focus();
}
function start(){
  const list=pool().slice();
  if(shuffle)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  run={list,i:0,score:0,ok:null,ans:null,hint:false,rec:false};draw();
}
function answer(v){
  const q=run.list[run.i];if(run.ok!==null)return;
  if(!isMC(q)&&!String(v).trim()){showToast('Hãy nhập đáp án trước nhé','error');return}
  run.ans=v;run.ok=isMC(q)?v===q.a:[].concat(q.a).some(x=>norm(x)===norm(v));
  if(run.ok)run.score++;
  uiSound(run.ok?'success':'error');draw();
}
function next(){
  run.i++;run.ok=null;run.ans=null;run.hint=false;
  if(run.i>=run.list.length){
    const n=run.list.length,k=cat||'*',bs=LS.g('bv_quiz_best',{});
    if(!bs[k]||run.score/n>bs[k].s/bs[k].n){bs[k]={s:run.score,n};LS.s('bv_quiz_best',bs);run.rec=run.score>0}
    uiSound(run.score/n>=.8?'applause':'chime');
  }
  draw();
}
$('qz-body').addEventListener('click',e=>{
  const k=e.target.closest('[data-k]'),a=e.target.closest('[data-act]')?.dataset.act;
  if(k)return answer(+k.dataset.k);
  if(a==='start')return start();
  if(a==='menu'){run=null;return draw()}
  if(a==='hint'){run.hint=true;return draw()}
  if(a==='submit')return answer($('qz-in').value);
  if(a==='next')return next();
});
$('qz-body').addEventListener('change',e=>{if(e.target.id==='qz-shuf')shuffle=e.target.checked});
$('qz-body').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qz-in')answer(e.target.value)});
$('qz-chips').addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;draw()}});
draw();
</script>
